[workspace]

[package]
name = "mcp-translate"
version = "1.0.1"
edition = "2024"
description = "Translation MCP server — translate text, detect languages, batch translate, translation memory (200+ languages, zero config)"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-translate"
keywords = ["mcp", "translation", "language", "i18n", "multilingual"]
categories = ["api-bindings", "internationalization"]

[dependencies]
adk-mcp-sdk = "0.1"
rmcp = { version = "3.1.2", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
chrono = "0.4"
urlencoding = "2"
